name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t used-car-valuation:latest .

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy placeholder
        env:
          DEPLOY_ENDPOINT: ${{ secrets.DEPLOY_ENDPOINT }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_ENDPOINT" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "Deployment secrets not configured; skipping deployment."
            exit 0
          fi
          echo "Deploying build to configured endpoint"
          curl -sS -X POST "$DEPLOY_ENDPOINT" \
            -H "Authorization: ******" \
            -H "Content-Type: application/json" \
            -d '{"service":"used-car-valuation","status":"ready"}'
