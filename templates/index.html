<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Price Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Vehicle valuation</p>
          <h1>Car Price Predictor</h1>
        </div>
      </header>

      <main class="content-grid">
        <section class="card form-card">
          <form id="car-form">
            <div class="field-grid">
              <label>
                <span>Year</span>
                <input type="number" id="year" name="year" min="1900" max="2035" value="2018" required />
              </label>

              <label>
                <span>Manufacturer</span>
                <input type="text" id="manufacturer" name="manufacturer" value="ford" autocomplete="off" required />
              </label>

              <label>
                <span>Model</span>
                <input type="text" id="model" name="model" value="focus" autocomplete="off" required />
              </label>

              <label>
                <span>Condition</span>
                <select id="condition" name="condition">
                  <option value="excellent">Excellent</option>
                  <option value="good" selected>Good</option>
                  <option value="fair">Fair</option>
                  <option value="salvage">Salvage</option>
                  <option value="like new">Like New</option>
                </select>
              </label>

              <label>
                <span>Cylinders</span>
                <input type="number" id="cylinders" name="cylinders" min="2" max="12" value="4" required />
              </label>

              <label>
                <span>Fuel</span>
                <select id="fuel" name="fuel">
                  <option value="gas" selected>Gas</option>
                  <option value="diesel">Diesel</option>
                  <option value="hybrid">Hybrid</option>
                  <option value="electric">Electric</option>
                </select>
              </label>

              <label>
                <span>Odometer</span>
                <input type="number" id="odometer" name="odometer" min="0" value="89000" required />
              </label>

              <label>
                <span>Title Status</span>
                <select id="title_status" name="title_status">
                  <option value="clean" selected>Clean</option>
                  <option value="rebuilt">Rebuilt</option>
                  <option value="salvage">Salvage</option>
                  <option value="lien">Lien</option>
                </select>
              </label>

              <label>
                <span>Transmission</span>
                <select id="transmission" name="transmission">
                  <option value="automatic" selected>Automatic</option>
                  <option value="manual">Manual</option>
                  <option value="other">Other</option>
                </select>
              </label>

              <label>
                <span>Drive</span>
                <select id="drive" name="drive">
                  <option value="front wheel drive" selected>Front Wheel Drive</option>
                  <option value="rear wheel drive">Rear Wheel Drive</option>
                  <option value="4wd">4WD</option>
                  <option value="awd">AWD</option>
                </select>
              </label>

              <label>
                <span>Size</span>
                <select id="size" name="size">
                  <option value="compact" selected>Compact</option>
                  <option value="mid-size">Mid-size</option>
                  <option value="full-size">Full-size</option>
                  <option value="subcompact">Subcompact</option>
                  <option value="suv">SUV</option>
                </select>
              </label>

              <label>
                <span>Type</span>
                <select id="type" name="type">
                  <option value="sedan" selected>Sedan</option>
                  <option value="hatchback">Hatchback</option>
                  <option value="coupe">Coupe</option>
                  <option value="truck">Truck</option>
                  <option value="suv">SUV</option>
                  <option value="wagon">Wagon</option>
                </select>
              </label>

              <label>
                <span>Paint Color</span>
                <select id="paint_color" name="paint_color">
                  <option value="blue" selected>Blue</option>
                  <option value="black">Black</option>
                  <option value="white">White</option>
                  <option value="red">Red</option>
                  <option value="silver">Silver</option>
                  <option value="green">Green</option>
                  <option value="gray">Gray</option>
                </select>
              </label>

              <label>
                <span>State</span>
                <input type="text" id="state" name="state" value="ca" minlength="2" maxlength="2" autocomplete="off" required />
              </label>
            </div>

            <p class="form-note">Tip: Use two-letter state codes like <strong>ca</strong>, <strong>tx</strong>, or <strong>ny</strong>.</p>

            <button type="submit" class="primary-button">Predict Price</button>
          </form>
        </section>

        <aside class="card result-card" aria-live="polite">
          <p class="result-label">Estimated value</p>
          <div id="predicted-price" class="predicted-price">$0</div>
          <p id="status-message" class="status-message">Enter car details and get an estimate.</p>
        </aside>
      </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
